[project]
name = "kingsastrology-backend"
version = "0.1.0"
description = "Deterministic backend for Kingsastrology, scoped to Brihat Jataka chapters 8-20."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
